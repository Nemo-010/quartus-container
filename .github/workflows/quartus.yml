name: quartus

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Resolve image name
        id: name
        run: |
          repo=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$repo" >> "$GITHUB_OUTPUT"

      - name: Build
        run: podman build -f Containerfile -t quartus:test .

      - name: Tools are present and run
        run: |
          set -euo pipefail
          podman run --rm quartus:test quartus_sh --version
          podman run --rm quartus:test quartus_map --version
          podman run --rm quartus:test quartus_fit --version
          podman run --rm quartus:test quartus_asm --version
          podman run --rm quartus:test quartus_sta --version
          podman run --rm quartus:test quartus_cpf --version
          podman run --rm quartus:test quartus_pgm --version
          podman run --rm quartus:test jtagconfig --help

      - name: ModelSim is present
        run: |
          set -euo pipefail
          podman run --rm quartus:test bash -c 'command -v vsim && vsim -version'

      - name: Cyclone device data is present
        run: |
          set -euo pipefail
          podman run --rm quartus:test bash -c \
            'ls -d /opt/quartus/quartus/common/devinfo/*'

      - name: Which Cyclone IV E parts does Quartus know?
        run: |
          set -euo pipefail
          cat > /tmp/parts.tcl <<'TCL'
          package require ::quartus::device
          puts "FAMILIES:"
          foreach f [get_device_families] { if {[string match -nocase "*Cyclone IV*" $f]} { puts "  $f" } }
          puts "PARTS:"
          foreach p [get_part_list -device_family "Cyclone IV E"] { if {[string match "EP4CE22*" $p]} { puts "  $p" } }
          TCL
          podman run --rm -v /tmp/parts.tcl:/tmp/parts.tcl:ro quartus:test \
            quartus_sh -t /tmp/parts.tcl 2>&1 | tail -40

      # The real test: synthesise a design for the DE0-Nano's part.
      - name: Synthesise a design for EP4CE22F17C6N
        run: |
          set -euo pipefail
          mkdir -p proj
          cat > proj/blinky.v <<'VERILOG'
          module blinky(input clk, output reg led);
            reg [23:0] cnt = 0;
            always @(posedge clk) begin
              cnt <= cnt + 1;
              led <= cnt[23];
            end
          endmodule
          VERILOG
          cat > proj/synth.tcl <<'TCL'
          package require ::quartus::project
          project_new blinky -overwrite
          set_global_assignment -name FAMILY "Cyclone IV E"
          set_global_assignment -name DEVICE EP4CE22F17C6N
          set_global_assignment -name VERILOG_FILE blinky.v
          set_global_assignment -name TOP_LEVEL_ENTITY blinky
          export_assignments
          project_close
          TCL
          cat > proj/build.tcl <<'TCL'
          package require ::quartus::project
          package require ::quartus::flow
          project_open blinky
          execute_flow -compile
          project_close
          TCL
          podman run --rm -v "$PWD/proj:/work" quartus:test bash -c \
            'cd /work && quartus_sh -t synth.tcl && quartus_sh -t build.tcl' \
            | tee synth.log
          grep -qi "successful" synth.log
          ls -la proj/output_files/ | tee files.txt
          grep -q "\.sof" files.txt

      - name: Image is amd64
        run: |
          arch=$(podman image inspect quartus:test --format '{{.Architecture}}')
          echo "architecture: $arch"
          test "$arch" = "amd64"

      - name: Report size
        run: podman image inspect quartus:test --format '{{.Size}}'

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          podman login ghcr.io -u "${{ github.actor }}" --password-stdin \
            <<< "${{ secrets.GITHUB_TOKEN }}"
          podman tag quartus:test "${{ steps.name.outputs.image }}:latest"
          podman push "${{ steps.name.outputs.image }}:latest"

  # Runs the amd64 image under qemu-user, which is what happens on Apple
  # Silicon. Proves synthesis works there too, not just on native x86-64.
  emulated:
    name: emulated (as on Apple Silicon)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install qemu-user-static
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support

      - name: Pull the published image
        run: podman pull --arch amd64 "${{ needs.build.outputs.image }}:latest"

      - name: Tools run under emulation
        run: |
          set -euo pipefail
          img="${{ needs.build.outputs.image }}:latest"
          podman run --rm "$img" quartus_sh --version
          podman run --rm "$img" quartus_map --version

      - name: Synthesise under emulation
        run: |
          set -euo pipefail
          img="${{ needs.build.outputs.image }}:latest"
          mkdir -p proj
          cat > proj/blinky.v <<'VERILOG'
          module blinky(input clk, output reg led);
            reg [23:0] cnt = 0;
            always @(posedge clk) begin
              cnt <= cnt + 1;
              led <= cnt[23];
            end
          endmodule
          VERILOG
          cat > proj/synth.tcl <<'TCL'
          package require ::quartus::project
          project_new blinky -overwrite
          set_global_assignment -name FAMILY "Cyclone IV E"
          set_global_assignment -name DEVICE EP4CE22F17C6N
          set_global_assignment -name VERILOG_FILE blinky.v
          set_global_assignment -name TOP_LEVEL_ENTITY blinky
          export_assignments
          project_close
          TCL
          cat > proj/build.tcl <<'TCL'
          package require ::quartus::project
          package require ::quartus::flow
          project_open blinky
          execute_flow -compile
          project_close
          TCL
          podman run --rm -v "$PWD/proj:/work" "$img" bash -c \
            'cd /work && quartus_sh -t synth.tcl && quartus_sh -t build.tcl' \
            | tee synth.log
          grep -qi "successful" synth.log
          ls proj/output_files/
          test -f proj/output_files/blinky.sof
